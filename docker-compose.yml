name: script-paired
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://paired:${DB_PASSWORD:-paired_local_demo}@db:5432/paired
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-paired-demo-change-in-production-3102}
    SEED_DEMO: ${SEED_DEMO:-true}
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-script-paired}-db
    environment:
      POSTGRES_DB: paired
      POSTGRES_USER: paired
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paired_local_demo}
    ports: ["${DB_PORT:-17714}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paired -d paired"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-script-paired}-redis
    command: [redis-server, --appendonly, "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-script-paired}-backend
    ports: ["${BACKEND_PORT:-19214}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 25
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-script-paired}-worker
    command: [python, -m, src.worker]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/heartbeat')<20"]
      interval: 5s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-script-paired}-frontend
    ports: ["${FRONTEND_PORT:-18214}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dbdata:
  redisdata:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.253.115.0/24}
